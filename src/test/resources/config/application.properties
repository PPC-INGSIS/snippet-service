# Se suma al application.properties de main (Spring carga los dos; este gana si repiten una propiedad).
# Valores falsos de Auth0: los tests fabrican sus tokens con jwt() y nunca llaman al emisor.
# .invalid es un dominio reservado que nunca existe, así que un llamado por error falla en vez de salir a internet.
AUTH0_DOMAIN=test.invalid
AUTH0_AUDIENCE=https://snippets-test