spring.application.name=snippets

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:snippets}
spring.datasource.username=${POSTGRES_USER:snippets}
spring.datasource.password=${POSTGRES_PASSWORD:snippets}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

printscript.url=${PRINTSCRIPT_URL:http://localhost:8082}
printscript.connect-timeout=${PRINTSCRIPT_CONNECT_TIMEOUT:2s}
# Mayor que printscript.limits.execution-timeout de PrintScript (5 s): al correr un test, PrintScript se
# da hasta 5 s para ejecutar y responde con el error "La ejecución superó...". Si Snippets cortara antes,
# el usuario vería un 502 genérico en vez de ese error. Si se sube el límite de PrintScript, subir este.
printscript.read-timeout=${PRINTSCRIPT_READ_TIMEOUT:10s}
# La ejecucion interactiva va por WebSocket, no por HTTP: misma direccion con otro esquema
printscript.ws-url=${PRINTSCRIPT_WS_URL:ws://localhost:8082}
# Cuanto se espera el mensaje de auth del browser antes de cerrar: si no autentica, no ocupa lugar
execution.auth-timeout=${EXECUTION_AUTH_TIMEOUT:5s}
# Ejecuciones interactivas abiertas a la vez por usuario. Bastante menor que el tope global de
# PrintScript (printscript.interactive.max-sessions, 16), para que un usuario no lo ocupe entero
snippets.execution.max-per-user=${SNIPPETS_EXECUTION_MAX_PER_USER:3}

# Cuanto se recuerda el nombre de un dueno antes de volver a preguntarselo a Auth0. Un nombre casi
# no cambia, y lo peor que pasa es mostrar uno viejo por unos minutos
snippets.authors.cache-ttl=${SNIPPETS_AUTHORS_CACHE_TTL:5m}
# Cuantos nombres se recuerdan a la vez. Con mas, se descartan los que hace mas tiempo no se usan
snippets.authors.cache-size=${SNIPPETS_AUTHORS_CACHE_SIZE:1000}

# El asset service de la catedra guarda el contenido de los snippets.
# 8083 es el puerto del compose de infraestructura, para desarrollar en local.
asset.url=${ASSET_SERVICE_URL:http://localhost:8083}
# connect: no me atienden. read: me atienden y no contestan.
asset.connect-timeout=${ASSET_CONNECT_TIMEOUT:2s}
asset.read-timeout=${ASSET_READ_TIMEOUT:5s}

# Permisos: quien tiene la tabla de accesos. Al crear un snippet se registra al dueno.
permissions.url=${PERMISSIONS_URL:http://localhost:8081}
permissions.connect-timeout=${PERMISSIONS_CONNECT_TIMEOUT:2s}
permissions.read-timeout=${PERMISSIONS_READ_TIMEOUT:5s}

# Redis Streams: la cola de trabajos en segundo plano
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Stream y grupo del spike de Redis
spike.ping.stream=spike.ping
spike.ping.group=snippets-spike

# Auth0: quién emite los tokens (iss) y para qué API son (aud).
# Sin valores por defecto: si faltan, el servicio no arranca.
# El iss de Auth0 es "https://<dominio>/", con la barra final: Spring lo compara como texto exacto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

# Management API de Auth0: listar usuarios al compartir un snippet.
# Credenciales de la app M2M "Snippets (M2M)", que solo tiene read:users. Sin valores por defecto.
auth0.management.url=https://${AUTH0_DOMAIN}
auth0.management.audience=https://${AUTH0_DOMAIN}/api/v2/
auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET}

# Detrás de nginx: armar las URLs con el esquema y el prefijo que ve el cliente (X-Forwarded-Proto y -Prefix).
# Es seguro porque solo nginx llega a Snippets (no publica puertos en las VMs) y nginx pisa esos headers.
server.forward-headers-strategy=framework

# Logs en JSON a stdout. El formato ECS ya incluye lo que haya en el MDC, asi que el
# trace.id y el user.id que ponen los filtros salen en cada linea sin escribirlos.
# Confirmado en Boot 4.1: logging.structured.format.console existe y el formato ecs
# anida las claves con punto (trace.id sale como {"trace":{"id":...}}).
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.structured.ecs.service.name=snippets
