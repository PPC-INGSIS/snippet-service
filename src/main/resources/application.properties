spring.application.name=snippets

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:snippets}
spring.datasource.username=${POSTGRES_USER:snippets}
spring.datasource.password=${POSTGRES_PASSWORD:snippets}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

printscript.url=${PRINTSCRIPT_URL:http://localhost:8082}

# Redis Streams: la cola de trabajos en segundo plano
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Stream y grupo del spike de Redis
spike.ping.stream=spike.ping
spike.ping.group=snippets-spike

# Auth0: quién emite los tokens (iss) y para qué API son (aud).
# Sin valores por defecto: si faltan, el servicio no arranca.
# El iss de Auth0 es "https://<dominio>/", con la barra final: Spring lo compara como texto exacto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
