spring.application.name=snippets

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:snippets}
spring.datasource.username=${POSTGRES_USER:snippets}
spring.datasource.password=${POSTGRES_PASSWORD:snippets}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

printscript.url=${PRINTSCRIPT_URL:http://localhost:8082}

# Redis Streams: la cola de trabajos en segundo plano
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Stream y grupo del spike de Redis
spike.ping.stream=spike.ping
spike.ping.group=snippets-spike