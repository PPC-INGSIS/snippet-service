services:
  snippets-db:
    container_name: snippet-postgres-db
    image: postgres:18
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snippets}
      POSTGRES_USER: ${POSTGRES_USER:-snippets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snippets}
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    container_name: snippet-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: